services:
  # PostgreSQL database service
  postgres:
    image: postgres:15-alpine
    container_name: chat-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Redis cache service
  redis:
    image: redis:8.2-rc1-alpine
    container_name: chat-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Backend service
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: chat-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
      ENVIRONMENT: ${ENVIRONMENT}
      # Auto-close idle chats (minutes idle before close, sweep interval seconds)
      INACTIVITY_MINUTES: ${INACTIVITY_MINUTES:-10}
      SWEEP_INTERVAL_SECONDS: ${SWEEP_INTERVAL_SECONDS:-60}
      # Prompt versioning (empty -> falls back to the in-code default "v1")
      PROMPT_VERSION_DEFAULT: ${PROMPT_VERSION_DEFAULT:-v1}
      PROMPT_VERSION_ROUTER: ${PROMPT_VERSION_ROUTER:-}
      PROMPT_VERSION_REFUND: ${PROMPT_VERSION_REFUND:-}
      PROMPT_VERSION_FAQ: ${PROMPT_VERSION_FAQ:-}
      PROMPT_VERSION_GUARDRAILS: ${PROMPT_VERSION_GUARDRAILS:-}
      PROMPT_VERSION_ESCALATION: ${PROMPT_VERSION_ESCALATION:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      # Anonymous volumes keep the image-built venv/caches from being shadowed
      # by the host bind mount above (host has no Linux .venv -> startup re-sync).
      - /app/.venv
      - /app/__pycache__
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      # Frontend waits on this; /health returns 200 only once uvicorn is serving.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # Frontend service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chat-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data: 